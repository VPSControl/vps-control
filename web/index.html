<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — VPS Control</title>
<link rel="icon" type="image/jpeg" href="/assets/logo-icon.jpg">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: { extend: {
    colors: { bg: '#0a0f1a', panel: '#111827', panel2: '#1a2332', border: '#1f2937', accent: '#22c55e', accentDark: '#16a34a', danger: '#ef4444' },
    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
  }}
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  html, body { background: #0a0f1a; color: #e5e7eb; font-family: 'Inter', system-ui, sans-serif; }
  body {
    background-image: radial-gradient(circle at 50% -10%, rgba(34,197,94,.15), transparent 40%);
    background-attachment: fixed;
  }
  input {
    background: #0a0f1a; border: 1px solid #1f2937; color: #e5e7eb;
    padding: 12px 14px; border-radius: 10px; font-size: 14px; width: 100%; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus { border-color: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.15); }
  input::placeholder { color: #4b5563; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-5">

<!-- Loading -->
<div id="screen-loading" class="flex flex-col items-center gap-4">
  <div class="w-12 h-12 rounded-full border-3 border-border border-t-accent animate-spin" style="border-width:3px"></div>
  <p class="text-xs text-gray-500">Chargement...</p>
</div>

<!-- Setup -->
<div id="screen-setup" class="hidden w-full max-w-md bg-panel border border-border rounded-2xl p-8 shadow-2xl">
  <div class="flex justify-center mb-6">
    <img src="/assets/logo-full.jpg" alt="VPS Control" class="h-14 rounded-lg">
  </div>

  <h1 class="text-2xl font-bold text-white text-center mb-2">Initial setup</h1>
  <div class="w-8 h-1 bg-accent rounded-full mx-auto mb-6"></div>

  <p class="text-sm text-gray-400 text-center leading-relaxed mb-6">
    Create the panel's first admin account. These credentials belong to VPS Control —
    they have nothing to do with the server's SSH or root access.
  </p>

  <form id="form-setup" class="space-y-4">
    <div>
      <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Username</label>
      <input type="text" name="username" minlength="3" maxlength="32" required autocomplete="username" placeholder="Enter username">
    </div>
    <div>
      <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Password</label>
      <input type="password" name="password" minlength="8" required autocomplete="new-password" placeholder="Create a secure password">
    </div>
    <button type="submit" class="w-full py-3 rounded-xl bg-accent hover:bg-accentDark text-slate-900 font-semibold text-sm transition">
      <i class="fas fa-shield-halved mr-2"></i>Create admin account
    </button>
    <p class="error text-xs text-danger text-center min-h-[18px]" id="setup-error"></p>
  </form>
</div>

<!-- Login -->
<div id="screen-login" class="hidden w-full max-w-md bg-panel border border-border rounded-2xl p-8 shadow-2xl">
  <div class="flex justify-center mb-6">
    <img src="/assets/logo-full.jpg" alt="VPS Control" class="h-14 rounded-lg">
  </div>

  <h1 class="text-2xl font-bold text-white text-center mb-2">Sign in</h1>
  <div class="w-8 h-1 bg-accent rounded-full mx-auto mb-6"></div>

  <form id="form-login" class="space-y-4">
    <div>
      <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Username</label>
      <input type="text" name="username" required autocomplete="username" placeholder="Enter your username">
    </div>
    <div>
      <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Password</label>
      <input type="password" name="password" required autocomplete="current-password" placeholder="Enter your password">
    </div>
    <button type="submit" class="w-full py-3 rounded-xl bg-accent hover:bg-accentDark text-slate-900 font-semibold text-sm transition">
      <i class="fas fa-right-to-bracket mr-2"></i>Sign in
    </button>
    <p class="error text-xs text-danger text-center min-h-[18px]" id="login-error"></p>
  </form>
</div>

<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-panel2 border border-accent text-white px-5 py-3 rounded-lg text-sm shadow-2xl hidden z-[200]"></div>

<script src="/app.js"></script>
<script>
function showScreen(id) {
  document.querySelectorAll('[id^="screen-"]').forEach(el => el.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

(async function() {
  if (location.pathname.startsWith('/invite/')) {
    location.href = '/invite.html?token=' + encodeURIComponent(location.pathname.replace('/invite/', ''));
    return;
  }
  try {
    const status = await api('/api/setup/status');
    if (status.needsSetup) { showScreen('screen-setup'); return; }
    const me = await api('/api/me').catch(() => null);
    if (me) { location.href = '/dashboard.html'; return; }
    showScreen('screen-login');
  } catch (e) {
    showScreen('screen-login');
  }
})();

document.getElementById('form-setup').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  document.getElementById('setup-error').textContent = '';
  try {
    await api('/api/setup', { method: 'POST', body: JSON.stringify(Object.fromEntries(fd)) });
    location.href = '/dashboard.html';
  } catch (err) {
    document.getElementById('setup-error').textContent = err.message;
  }
});

document.getElementById('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  document.getElementById('login-error').textContent = '';
  try {
    await api('/api/login', { method: 'POST', body: JSON.stringify(Object.fromEntries(fd)) });
    const pending = sessionStorage.getItem('pendingInvite');
    if (pending) {
      sessionStorage.removeItem('pendingInvite');
      location.href = '/invite.html?token=' + encodeURIComponent(pending);
      return;
    }
    location.href = '/dashboard.html';
  } catch (err) {
    document.getElementById('login-error').textContent = err.message;
  }
});
</script>
</body>
</html>
