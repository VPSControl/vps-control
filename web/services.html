<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Services — VPS Control</title>
<link rel="icon" type="image/jpeg" href="/assets/logo-icon.jpg">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: { extend: {
    colors: { bg: '#0a0f1a', panel: '#111827', panel2: '#1a2332', border: '#1f2937', accent: '#22c55e', accentDark: '#16a34a', danger: '#ef4444' },
    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
  }}
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  html, body { background: #0a0f1a; color: #e5e7eb; font-family: 'Inter', system-ui, sans-serif; }
  input, select {
    background: #0a0f1a; border: 1px solid #1f2937; color: #e5e7eb;
    padding: 10px 12px; border-radius: 8px; font-size: 13.5px; width: 100%; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus { border-color: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.12); }
  select { -webkit-appearance: none; appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239ca3af' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 10px center; background-size: 16px; padding-right: 34px; }
</style>
</head>
<body class="min-h-screen">

<header class="lg:hidden fixed top-0 left-0 right-0 z-40 bg-panel border-b border-border px-4 py-3 flex items-center justify-between">
  <button id="btn-menu" class="text-gray-300 hover:text-white p-2"><i class="fas fa-bars text-xl"></i></button>
  <span class="text-sm font-semibold text-gray-300">Services</span>
  <div class="w-8"></div>
</header>

<div id="sidebar-overlay" class="hidden fixed inset-0 bg-black/60 z-40 lg:hidden"></div>

<div class="flex min-h-screen pt-14 lg:pt-0">
  <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 z-50 w-64 bg-panel border-r border-border flex flex-col transform -translate-x-full lg:translate-x-0 transition-transform duration-200">
    <div class="p-5 border-b border-border flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-accent/15 border border-accent/30 flex items-center justify-center text-accent"><i class="fas fa-server"></i></div>
        <div><div class="text-sm font-bold text-white">VPS Control</div><div class="text-[10px] uppercase tracking-wider text-gray-500">Admin Panel</div></div>
      </div>
      <button id="btn-close-sidebar" class="lg:hidden text-gray-500 hover:text-white"><i class="fas fa-xmark"></i></button>
    </div>
    <nav class="flex-1 overflow-y-auto p-3 space-y-1" id="nav-container"></nav>
    <div class="p-4 border-t border-border">
      <div class="flex items-center justify-between">
        <div class="text-xs text-gray-500 truncate" id="current-user">—</div>
        <button id="btn-logout" class="text-xs text-accent hover:text-accentDark font-medium"><i class="fas fa-right-from-bracket"></i></button>
      </div>
    </div>
  </aside>

  <main class="flex-1 min-w-0 p-4 lg:p-8">
    <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
      <h1 class="text-xl lg:text-2xl font-bold text-white">Docker Services</h1>
      <button id="btn-refresh" class="px-3 py-2 rounded-lg bg-panel2 border border-border text-sm text-gray-300 hover:border-accent hover:text-accent transition">
        <i class="fas fa-rotate mr-2"></i>Refresh
      </button>
    </div>

    <div class="bg-panel border border-border rounded-xl overflow-hidden mb-6">
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead>
            <tr class="border-b border-border">
              <th class="text-left text-xs uppercase tracking-wider text-gray-500 font-medium px-4 py-3">Name</th>
              <th class="text-left text-xs uppercase tracking-wider text-gray-500 font-medium px-4 py-3 hidden md:table-cell">Image</th>
              <th class="text-left text-xs uppercase tracking-wider text-gray-500 font-medium px-4 py-3">Status</th>
              <th class="text-left text-xs uppercase tracking-wider text-gray-500 font-medium px-4 py-3 hidden lg:table-cell">Ports</th>
              <th class="px-4 py-3"></th>
            </tr>
          </thead>
          <tbody id="services-table">
            <tr><td colspan="5" class="text-center text-gray-500 py-6">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="bg-panel border border-border rounded-xl p-5">
      <h2 class="font-semibold text-white mb-4 flex items-center gap-2">
        <i class="fas fa-database text-gray-400"></i>Quick database
      </h2>
      <form id="form-db-service" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
        <input name="name" placeholder="name (e.g. myapp)" required>
        <select name="engine">
          <option value="mysql">MySQL</option>
          <option value="postgres">PostgreSQL</option>
        </select>
        <input name="dbName" placeholder="database name" required>
        <input name="user" placeholder="user" required>
        <input name="password" type="password" placeholder="password" required>
        <input name="port" placeholder="host port" required>
        <button type="submit" class="md:col-span-2 lg:col-span-1 px-4 py-2.5 rounded-lg bg-accent hover:bg-accentDark text-slate-900 font-semibold text-sm transition">
          <i class="fas fa-plus mr-2"></i>Create
        </button>
      </form>
    </div>
  </main>
</div>

<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-panel2 border border-accent text-white px-5 py-3 rounded-lg text-sm shadow-2xl hidden z-[100]"></div>

<script src="/app.js"></script>
<script>
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('sidebar-overlay');
document.getElementById('btn-menu')?.addEventListener('click', () => { sidebar.classList.remove('-translate-x-full'); overlay.classList.remove('hidden'); });
document.getElementById('btn-close-sidebar')?.addEventListener('click', () => { sidebar.classList.add('-translate-x-full'); overlay.classList.add('hidden'); });
overlay?.addEventListener('click', () => { sidebar.classList.add('-translate-x-full'); overlay.classList.add('hidden'); });

function buildNav(active, isAdmin) {
  const items = [
    { href: '/dashboard.html', icon: 'fa-gauge-high', label: 'Dashboard', id: 'dashboard' },
    { href: '/servers.html', icon: 'fa-server', label: 'My apps', id: 'servers' },
    { href: isAdmin ? '/deploy.html' : '/deploy-user.html', icon: 'fa-rocket', label: 'Deploy', id: 'deploy' },
    { href: '/servers-admin.html', icon: 'fa-layer-group', label: 'Servers', id: 'servers-admin', admin: true },
    { href: '/files.html', icon: 'fa-folder', label: 'Files', id: 'files', admin: true },
    { href: '/services.html', icon: 'fa-cube', label: 'Services', id: 'services', admin: true },
    { href: '/databases.html', icon: 'fa-database', label: 'Databases', id: 'databases', admin: true },
    { href: '/users.html', icon: 'fa-users', label: 'Users', id: 'users', admin: true },
    { href: '/activity.html', icon: 'fa-clock-rotate-left', label: 'Activity', id: 'activity', admin: true },
    { href: '/tokens.html', icon: 'fa-key', label: 'API Tokens', id: 'tokens' },
    { href: '/system.html', icon: 'fa-gear', label: 'System', id: 'system', admin: true },
  ];
  document.getElementById('nav-container').innerHTML = items.filter(i => !i.admin || isAdmin).map(i =>
    `<a href="${i.href}" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium ${i.id === active ? 'bg-accent/10 text-accent' : 'text-gray-400 hover:bg-panel2 hover:text-white transition'}"><i class="fas ${i.icon} w-4"></i><span>${i.label}</span></a>`
  ).join('');
}

(async function() {
  const me = await requireAuth({ adminOnly: true });
  if (!me) return;
  window.currentUser = me;
  document.getElementById('current-user').textContent = `${me.username} (${me.role})`;
  buildNav('services', me.role === 'admin');
  document.getElementById('btn-logout').addEventListener('click', async () => {
    await api('/api/logout', { method: 'POST' }).catch(() => {});
    location.href = '/index.html';
  });
  loadServices();
})();

document.getElementById('btn-refresh').addEventListener('click', loadServices);

async function loadServices() {
  const tbody = document.getElementById('services-table');
  tbody.innerHTML = '<tr><td colspan="5" class="text-center text-gray-500 py-6">Loading...</td></tr>';
  try {
    const services = await api('/api/services');
    if (services.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="text-center text-gray-500 py-6">No Docker service yet.</td></tr>';
      return;
    }
    tbody.innerHTML = '';
    services.forEach(s => {
      const isUp = /up/i.test(s.Status);
      const tr = document.createElement('tr');
      tr.className = 'border-b border-border hover:bg-panel2 transition';
      tr.innerHTML = `
        <td class="px-4 py-3 text-sm text-white">${escapeHtml(s.Names)}</td>
        <td class="px-4 py-3 text-sm text-gray-500 hidden md:table-cell">${escapeHtml(s.Image)}</td>
        <td class="px-4 py-3">
          <span class="inline-block px-2 py-1 rounded-md text-xs font-semibold ${isUp ? 'bg-accent/15 text-accent' : 'bg-danger/15 text-danger'}">${escapeHtml(s.Status)}</span>
        </td>
        <td class="px-4 py-3 text-xs text-gray-500 font-mono hidden lg:table-cell">${escapeHtml(s.Ports || '—')}</td>
        <td class="px-4 py-3 text-right whitespace-nowrap"></td>`;
      const actions = tr.querySelector('td:last-child');
      actions.append(
        btnAction('play', 'Start', () => serviceAction(s.Names, 'start')),
        btnAction('stop', 'Stop', () => serviceAction(s.Names, 'stop')),
        btnAction('rotate', 'Restart', () => serviceAction(s.Names, 'restart')),
        btnAction('file-lines', 'Logs', () => showLogs(s.Names)),
        btnAction('trash', 'Remove', () => deleteService(s.Names), true),
      );
      tbody.appendChild(tr);
    });
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-6">${escapeHtml(err.message)}</td></tr>`;
  }
}

function btnAction(icon, title, onClick, danger = false) {
  const b = document.createElement('button');
  b.className = `text-xs px-2 py-1.5 rounded-md border transition mr-1 ${danger ? 'bg-panel2 border-border text-gray-300 hover:border-danger hover:text-danger' : 'bg-panel2 border-border text-gray-300 hover:border-accent hover:text-accent'}`;
  b.title = title;
  b.innerHTML = `<i class="fas fa-${icon}"></i>`;
  b.addEventListener('click', onClick);
  return b;
}

async function serviceAction(name, action) {
  try {
    await api(`/api/services/${encodeURIComponent(name)}/${action}`, { method: 'POST' });
    toast(`Service ${name}: ${action} done`);
    loadServices();
  } catch (err) { toast(err.message, true); }
}

async function deleteService(name) {
  if (!confirm(`Permanently remove the service "${name}"?`)) return;
  try {
    await api(`/api/services/${encodeURIComponent(name)}`, { method: 'DELETE' });
    toast(`Service ${name} removed`);
    loadServices();
  } catch (err) { toast(err.message, true); }
}

async function showLogs(name) {
  try {
    const data = await api(`/api/services/${encodeURIComponent(name)}/logs`);
    alert(`Logs for ${name} (last 300 lines):\n\n${data.logs || '(empty)'}`);
  } catch (err) { toast(err.message, true); }
}

document.getElementById('form-db-service').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = Object.fromEntries(new FormData(e.target));
  try {
    const res = await api('/api/services/database', { method: 'POST', body: JSON.stringify(fd) });
    toast(`Database created: container ${res.container}`);
    e.target.reset();
    loadServices();
  } catch (err) { toast(err.message, true); }
});
</script>
</body>
</html>
