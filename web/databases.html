<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Databases — VPS Control</title>
<link rel="icon" type="image/jpeg" href="/assets/logo-icon.jpg">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: { extend: {
    colors: { bg: '#0a0f1a', panel: '#111827', panel2: '#1a2332', border: '#1f2937', accent: '#22c55e', accentDark: '#16a34a', danger: '#ef4444' },
    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
  }}
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  html, body { background: #0a0f1a; color: #e5e7eb; font-family: 'Inter', system-ui, sans-serif; }
  input, select, textarea {
    background: #0a0f1a; border: 1px solid #1f2937; color: #e5e7eb;
    padding: 10px 12px; border-radius: 8px; font-size: 13.5px; width: 100%; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus, textarea:focus { border-color: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.12); }
  select { -webkit-appearance: none; appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239ca3af' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 10px center; background-size: 16px; padding-right: 34px; }
  textarea { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12.5px; min-height: 90px; resize: vertical; }
  .mono-block { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12.5px; background: #0a0f1a; border: 1px solid #1f2937; border-radius: 10px; padding: 14px; white-space: pre-wrap; max-height: 340px; overflow-y: auto; color: #e5e7eb; }
</style>
</head>
<body class="min-h-screen">

<header class="lg:hidden fixed top-0 left-0 right-0 z-40 bg-panel border-b border-border px-4 py-3 flex items-center justify-between">
  <button id="btn-menu" class="text-gray-300 hover:text-white p-2"><i class="fas fa-bars text-xl"></i></button>
  <span class="text-sm font-semibold text-gray-300">Databases</span>
  <div class="w-8"></div>
</header>

<div id="sidebar-overlay" class="hidden fixed inset-0 bg-black/60 z-40 lg:hidden"></div>

<div class="flex min-h-screen pt-14 lg:pt-0">
  <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 z-50 w-64 bg-panel border-r border-border flex flex-col transform -translate-x-full lg:translate-x-0 transition-transform duration-200">
    <div class="p-5 border-b border-border flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-accent/15 border border-accent/30 flex items-center justify-center text-accent"><i class="fas fa-server"></i></div>
        <div><div class="text-sm font-bold text-white">VPS Control</div><div class="text-[10px] uppercase tracking-wider text-gray-500">Admin Panel</div></div>
      </div>
      <button id="btn-close-sidebar" class="lg:hidden text-gray-500 hover:text-white"><i class="fas fa-xmark"></i></button>
    </div>
    <nav class="flex-1 overflow-y-auto p-3 space-y-1" id="nav-container"></nav>
    <div class="p-4 border-t border-border">
      <div class="flex items-center justify-between">
        <div class="text-xs text-gray-500 truncate" id="current-user">—</div>
        <button id="btn-logout" class="text-xs text-accent hover:text-accentDark font-medium"><i class="fas fa-right-from-bracket"></i></button>
      </div>
    </div>
  </aside>

  <main class="flex-1 min-w-0 p-4 lg:p-8">
    <h1 class="text-xl lg:text-2xl font-bold text-white mb-6">Databases</h1>

    <div class="bg-panel border border-border rounded-xl p-5 mb-6">
      <h2 class="font-semibold text-white mb-4 flex items-center gap-2">
        <i class="fas fa-plug text-gray-400"></i>Connect an existing database
      </h2>
      <form id="form-db-connection" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3">
        <input name="name" placeholder="name" required>
        <select name="driver">
          <option value="mysql">MySQL</option>
          <option value="postgres">PostgreSQL</option>
        </select>
        <input name="host" placeholder="host" required>
        <input name="port" placeholder="port" required>
        <input name="user" placeholder="user" required>
        <input name="password" type="password" placeholder="password">
        <input name="dbname" placeholder="database name" required>
        <button type="submit" class="px-4 py-2.5 rounded-lg bg-accent hover:bg-accentDark text-slate-900 font-semibold text-sm transition">
          <i class="fas fa-link mr-2"></i>Connect
        </button>
      </form>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
      <div class="bg-panel border border-border rounded-xl p-4">
        <h3 class="text-sm font-semibold text-white mb-3 flex items-center gap-2">
          <i class="fas fa-list text-gray-500"></i>Connections
        </h3>
        <ul id="db-connections-list" class="space-y-1 text-sm"></ul>
      </div>

      <div class="bg-panel border border-border rounded-xl p-4">
        <h3 class="text-sm font-semibold text-white mb-3 flex items-center gap-2">
          <i class="fas fa-table text-gray-500"></i>Tables
        </h3>
        <ul id="db-tables-list" class="space-y-1 text-sm"></ul>
      </div>

      <div class="lg:col-span-2">
        <div id="db-rows-area" class="hidden space-y-4">
          <div class="bg-panel border border-border rounded-xl overflow-hidden">
            <div class="px-4 py-3 border-b border-border">
              <h3 id="db-rows-title" class="text-sm font-semibold text-white"></h3>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full" id="db-rows-table"></table>
            </div>
          </div>

          <details class="bg-panel border border-border rounded-xl p-4">
            <summary class="cursor-pointer font-semibold text-accent text-sm select-none">
              <i class="fas fa-terminal mr-2"></i>Free-form SQL query
            </summary>
            <textarea id="db-query-input" class="mt-3" placeholder="SELECT * FROM ..."></textarea>
            <button id="btn-run-query" class="mt-2 px-4 py-2 rounded-lg bg-accent hover:bg-accentDark text-slate-900 font-semibold text-sm transition">
              <i class="fas fa-play mr-2"></i>Run
            </button>
            <pre id="db-query-result" class="mono-block mt-3"></pre>
          </details>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-panel2 border border-accent text-white px-5 py-3 rounded-lg text-sm shadow-2xl hidden z-[100]"></div>

<script src="/app.js"></script>
<script>
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('sidebar-overlay');
document.getElementById('btn-menu')?.addEventListener('click', () => { sidebar.classList.remove('-translate-x-full'); overlay.classList.remove('hidden'); });
document.getElementById('btn-close-sidebar')?.addEventListener('click', () => { sidebar.classList.add('-translate-x-full'); overlay.classList.add('hidden'); });
overlay?.addEventListener('click', () => { sidebar.classList.add('-translate-x-full'); overlay.classList.add('hidden'); });

function buildNav(active, isAdmin) {
  const items = [
    { href: '/dashboard.html', icon: 'fa-gauge-high', label: 'Dashboard', id: 'dashboard' },
    { href: '/servers.html', icon: 'fa-server', label: 'My apps', id: 'servers' },
    { href: isAdmin ? '/deploy.html' : '/deploy-user.html', icon: 'fa-rocket', label: 'Deploy', id: 'deploy' },
    { href: '/servers-admin.html', icon: 'fa-layer-group', label: 'Servers', id: 'servers-admin', admin: true },
    { href: '/files.html', icon: 'fa-folder', label: 'Files', id: 'files', admin: true },
    { href: '/services.html', icon: 'fa-cube', label: 'Services', id: 'services', admin: true },
    { href: '/databases.html', icon: 'fa-database', label: 'Databases', id: 'databases', admin: true },
    { href: '/users.html', icon: 'fa-users', label: 'Users', id: 'users', admin: true },
    { href: '/activity.html', icon: 'fa-clock-rotate-left', label: 'Activity', id: 'activity', admin: true },
    { href: '/tokens.html', icon: 'fa-key', label: 'API Tokens', id: 'tokens' },
    { href: '/system.html', icon: 'fa-gear', label: 'System', id: 'system', admin: true },
  ];
  document.getElementById('nav-container').innerHTML = items.filter(i => !i.admin || isAdmin).map(i =>
    `<a href="${i.href}" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium ${i.id === active ? 'bg-accent/10 text-accent' : 'text-gray-400 hover:bg-panel2 hover:text-white transition'}"><i class="fas ${i.icon} w-4"></i><span>${i.label}</span></a>`
  ).join('');
}

let activeDbConnectionId = null;

(async function() {
  const me = await requireAuth({ adminOnly: true });
  if (!me) return;
  window.currentUser = me;
  document.getElementById('current-user').textContent = `${me.username} (${me.role})`;
  buildNav('databases', me.role === 'admin');
  document.getElementById('btn-logout').addEventListener('click', async () => {
    await api('/api/logout', { method: 'POST' }).catch(() => {});
    location.href = '/index.html';
  });
  loadDbConnections();
})();

async function loadDbConnections() {
  const list = document.getElementById('db-connections-list');
  list.innerHTML = '<li class="text-gray-500 text-xs">Loading...</li>';
  try {
    const conns = await api('/api/db/connections');
    if (conns.length === 0) {
      list.innerHTML = '<li class="text-gray-500 text-xs">No connection yet.</li>';
      return;
    }
    list.innerHTML = '';
    conns.forEach(c => {
      const li = document.createElement('li');
      li.className = 'px-3 py-2 rounded-lg cursor-pointer text-gray-300 hover:bg-panel2 hover:text-white transition text-xs';
      li.innerHTML = `<i class="fas fa-database text-gray-500 mr-2"></i>${escapeHtml(c.name)} <span class="text-gray-500">(${escapeHtml(c.driver)})</span>`;
      li.addEventListener('click', () => selectDbConnection(c));
      list.appendChild(li);
    });
  } catch (err) {
    list.innerHTML = `<li class="text-danger text-xs">${escapeHtml(err.message)}</li>`;
  }
}

document.getElementById('form-db-connection').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = Object.fromEntries(new FormData(e.target));
  try {
    await api('/api/db/connections', { method: 'POST', body: JSON.stringify(fd) });
    toast('Connection added');
    e.target.reset();
    loadDbConnections();
  } catch (err) { toast(err.message, true); }
});

async function selectDbConnection(conn) {
  activeDbConnectionId = conn.id;
  document.querySelectorAll('#db-connections-list li').forEach(li => li.classList.remove('bg-accent/10','text-accent'));
  document.getElementById('db-rows-area').classList.add('hidden');
  const tablesList = document.getElementById('db-tables-list');
  tablesList.innerHTML = '<li class="text-gray-500 text-xs">Loading...</li>';
  try {
    const tables = await api(`/api/db/connections/${conn.id}/tables`);
    if (tables.length === 0) {
      tablesList.innerHTML = '<li class="text-gray-500 text-xs">No table.</li>';
      return;
    }
    tablesList.innerHTML = '';
    tables.forEach(t => {
      const li = document.createElement('li');
      li.className = 'px-3 py-2 rounded-lg cursor-pointer text-gray-300 hover:bg-panel2 hover:text-white transition text-xs';
      li.innerHTML = `<i class="fas fa-table text-gray-500 mr-2"></i>${escapeHtml(t)}`;
      li.addEventListener('click', () => loadTableRows(conn.id, t));
      tablesList.appendChild(li);
    });
  } catch (err) {
    tablesList.innerHTML = `<li class="text-danger text-xs">${escapeHtml(err.message)}</li>`;
  }
}

async function loadTableRows(connId, table) {
  document.getElementById('db-rows-area').classList.remove('hidden');
  document.getElementById('db-rows-title').textContent = table;
  const el = document.getElementById('db-rows-table');
  el.innerHTML = '<tr><td class="text-gray-500 text-center py-6">Loading...</td></tr>';
  try {
    const result = await api(`/api/db/connections/${connId}/tables/${encodeURIComponent(table)}/rows?limit=100`);
    renderResultTable(el, result);
  } catch (err) {
    el.innerHTML = `<tr><td class="text-danger text-center py-6">${escapeHtml(err.message)}</td></tr>`;
  }
}

function renderResultTable(el, result) {
  if (!result.columns || result.rows.length === 0) {
    el.innerHTML = '<tr><td class="text-gray-500 text-center py-6">No data.</td></tr>';
    return;
  }
  const thead = `<thead><tr class="border-b border-border">${result.columns.map(c => `<th class="text-left text-xs uppercase tracking-wider text-gray-500 font-medium px-3 py-2">${escapeHtml(c)}</th>`).join('')}</tr></thead>`;
  const tbody = `<tbody>${result.rows.map(row =>
    `<tr class="border-b border-border hover:bg-panel2 transition">${result.columns.map(c => `<td class="px-3 py-2 text-xs font-mono text-gray-300">${escapeHtml(String(row[c] ?? ''))}</td>`).join('')}</tr>`
  ).join('')}</tbody>`;
  el.innerHTML = thead + tbody;
}

document.getElementById('btn-run-query').addEventListener('click', async () => {
  if (!activeDbConnectionId) { toast('Select a connection first', true); return; }
  const sql = document.getElementById('db-query-input').value.trim();
  if (!sql) return;
  const resultEl = document.getElementById('db-query-result');
  resultEl.textContent = 'Running...';
  try {
    const result = await api(`/api/db/connections/${activeDbConnectionId}/query`, {
      method: 'POST', body: JSON.stringify({ sql }),
    });
    resultEl.textContent = JSON.stringify(result, null, 2);
  } catch (err) {
    resultEl.textContent = 'Error: ' + err.message;
  }
});
</script>
</body>
</html>
